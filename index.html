<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>留白书屋</title><style>body{margin:0;background:#fafaf8;color:#242424;font:16px/1.7 system-ui,'Microsoft YaHei',sans-serif}header,main{max-width:1000px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd}h1{font-size:26px;letter-spacing:3px}h2{font-size:21px}button,input,select,textarea{font:inherit;padding:9px;border:1px solid #ccc;border-radius:4px;background:white}button{cursor:pointer}button:hover{background:#eee}input,textarea{box-sizing:border-box;max-width:100%}.muted{color:#777}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.letters{display:flex;gap:6px;flex-wrap:wrap}.letters button{padding:4px 9px}.letters .active{background:#242424;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:22px;margin-top:24px}.book{cursor:pointer}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;background:#eae8e3}.placeholder{display:flex;align-items:center;justify-content:center;color:#888}.book{border:1px solid #e5e5e1;padding:18px;background:#fff;border-radius:5px}.book strong{display:block;margin-top:8px}.excerpt{color:#777;font-size:14px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}.longtext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9}.stars{display:inline-flex;gap:3px;align-items:center;color:#b18a38;font-size:21px;letter-spacing:1px}.stars .empty{color:#d7d5d0}.rating-picker{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rating-picker button{font-size:26px;line-height:1.2;padding:3px 5px;border:0;background:transparent;color:#c9c7c2}.rating-picker button.chosen{color:#b18a38}.rating-picker button:focus-visible{outline:2px solid #777}.hidden{display:none!important}.panel{max-width:650px;margin:30px auto}.field{display:grid;gap:4px;margin:12px 0}.field input,.field textarea,.field select{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}.error{color:#ae3030;white-space:pre-wrap}.detailcover{width:160px;max-width:40%;float:left;margin:0 20px 12px 0}.tag{font-size:12px;background:#f0eee8;color:#615c50;padding:3px 9px;border-radius:14px;display:inline-block;margin:3px 5px 3px 0}.tagbar{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 16px}.tagbar button{border-radius:18px;padding:4px 12px;font-size:13px}.tagbar button.active{background:#35342f;color:#fff;border-color:#35342f}.taglist{margin-top:9px}.taghint{font-size:13px;color:#777}footer{padding:30px;text-align:center;color:#888}@media(max-width:500px){header,main{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}.tag-choices{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0;min-height:46px}.tag-choices button{border:1px solid #ccc;border-radius:18px;padding:5px 12px;background:transparent;cursor:pointer}.tag-choices button.active{background:#35342f;color:white;border-color:#35342f}.tag-create{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tag-create input{flex:1;min-width:180px}.tag-create button{white-space:nowrap}
</style></head><body><header><div><h1>留白书屋</h1><small class="muted">爱好自由，特长散漫。</small></div><div class="actions"><button id="addBtn" class="hidden">＋ 添加作品</button><button id="adminBtn">管理员登录</button></div></header><main><section id="home"><div class="toolbar"><input id="search" placeholder="搜索书名或主角" aria-label="搜索"><select id="category"><option value="">全部分类</option><option>漫画</option><option>小说</option><option>其他书籍</option></select><select id="status"><option value="">全部状态</option><option>已读</option><option>在读</option><option>想读</option><option>弃读</option></select></div><div class="taghint">按星级筛选</div><div class="tagbar" id="ratingFilters"></div><div class="taghint">按标签筛选（可同时选择多个标签）</div><div class="tagbar" id="tagFilters"></div><div class="letters" id="letters"></div><p class="muted" id="count"></p><div class="grid" id="books"></div></section><section id="detail" class="panel hidden"><button id="back">← 返回目录</button><div id="detailContent"></div><div class="actions hidden" id="detailActions"><button id="editBtn">编辑作品</button><button id="deleteBtn">删除作品</button></div></section><section id="login" class="panel hidden"><h2>管理员登录</h2><form id="loginForm"><label class="field">邮箱<input id="email" type="email" autocomplete="email" required></label><label class="field">密码<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">登录</button></form><p id="loginError" class="error"></p></section><section id="editor" class="panel hidden"><h2 id="editorTitle">添加新作品</h2><form id="bookForm"><label class="field">作品名称 *<input name="title" required maxlength="200"></label><label class="field">排序名称（拼音或英文，A–Z 索引用）*<input name="sort_title" required maxlength="200" placeholder="例如 Jin Ji De Ju Ren"></label><label class="field">主角<input name="author" maxlength="200"></label><label class="field">分类<select name="category"><option>漫画</option><option>小说</option><option>其他书籍</option></select></label><div class="field"><label>作品标签（可多选）</label><div id="tagChoices" class="tag-choices" aria-label="作品标签"></div><div class="tag-create"><input id="newTagName" type="text" maxlength="40" placeholder="输入新标签名称，例如：群像"><button type="button" id="createTagBtn">创建标签</button></div><small class="muted">点击标签即可选择或取消；新标签创建后会保存在标签库中，所有作品都能使用。</small><p id="tagManageError" class="muted" role="status"></p></div><label class="field">作品简介／剧情梗概<textarea name="description" rows="7" placeholder="填写作品的背景、主要剧情或故事梗概"></textarea></label><label class="field">阅读状态<select name="status"><option>想读</option><option>在读</option><option>已读</option><option>弃读</option></select></label><div class="field"><label id="ratingLabel">星级（可选择未评分）</label><div class="rating-picker" id="ratingPicker" role="group" aria-labelledby="ratingLabel"><button type="button" id="clearRating">未评分</button><span id="starButtons"></span><span class="muted" id="ratingText">未评分</span></div><input type="hidden" name="rating" id="ratingValue" value=""></div><label class="field">阅读进度<input name="progress" placeholder="例如 第3卷 / 共12卷"></label><label class="field">评价<textarea name="review" rows="7"></textarea></label><div class="actions"><button type="submit">保存作品</button><button type="button" id="cancelEdit">取消</button></div><p id="saveError" class="error"></p></form></section><p id="globalError" class="error"></p></main><footer>留白书屋 · 阅读档案</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="app.js"></script></body></html>
